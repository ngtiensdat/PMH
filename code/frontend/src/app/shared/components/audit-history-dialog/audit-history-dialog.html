<ng-template [tuiDialog]="isOpen" (tuiDialogChange)="onDialogChange($event)" [tuiDialogOptions]="{label: 'Lịch sử thao tác', size: 'l'}">
  <div class="dialog-history-container">
    <div *ngIf="targetName" class="history-target-info">
      Đối tượng: <span class="highlight-text">{{ targetName }}</span>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="loading-container">
      <tui-loader size="m"></tui-loader>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && historyData.length === 0" class="empty-history">
      Chưa có lịch sử thao tác cho bản ghi này.
    </div>

    <!-- Table layout (5 columns: Người dùng, Ngày thực hiện, Thao tác, IP, Nội dung) -->
    <div *ngIf="!isLoading && historyData.length > 0" class="table-wrapper">
      <table class="audit-table">
        <thead>
          <tr>
            <th style="width: 220px;">Người dùng</th>
            <th style="width: 170px;">Ngày thực hiện</th>
            <th style="width: 130px;">Thao tác</th>
            <th style="width: 120px;">IP</th>
            <th>Nội dung</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of historyData; trackBy: trackByHistoryIndex">
            <!-- Người dùng (Avatar + Tên + Mã CB) -->
            <td>
              <div class="user-cell">
                <div class="avatar">{{ item.user.avatar }}</div>
                <div class="user-details">
                  <div class="user-name">{{ item.user.name }}</div>
                  <div class="user-code">{{ item.user.code }}</div>
                </div>
              </div>
            </td>
            <!-- Ngày thực hiện -->
            <td class="date-cell">{{ item.date }}</td>
            <!-- Thao tác -->
            <td class="action-cell">
              <span [class]="'action-pill ' + getActionPillClass(item.action)">
                {{ item.action }}
              </span>
            </td>
            <!-- IP -->
            <td class="ip-cell">{{ item.ip }}</td>
            <!-- Nội dung -->
            <td class="content-cell" [title]="item.content">{{ item.content }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination (Luôn hiển thị khi có dữ liệu) -->
    <div *ngIf="historyData.length > 0" class="pagination-wrapper">
      <tui-pagination
        [length]="historyTotalPages"
        [index]="historyPage"
        (indexChange)="onPageChange($event)"
      ></tui-pagination>
    </div>
  </div>

  <div class="dialog-footer tui-space_top-4" style="display: flex; justify-content: flex-end;">
    <button tuiButton appearance="secondary" type="button" (click)="onClose()">Đóng</button>
  </div>
</ng-template>
