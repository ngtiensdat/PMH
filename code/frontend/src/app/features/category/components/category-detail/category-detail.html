<div class="form-page-wrapper" style="position: relative; min-height: 400px;">
  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span>{{ languageService.labels().navigation.paramSetting }}</span>
    <span class="divider">&gt;</span>
    <span>{{ languageService.labels().category.title }}</span>
    <span class="divider">&gt;</span>
    <span class="current">{{ languageService.labels().common.comparisonDetail }}</span>
  </div>

  <!-- Header của trang -->
  <div class="form-header-row">
    <div class="form-header-left" (click)="goBack()">
      <span class="back-arrow">
        <tui-icon icon="@tui.chevron-left" style="--tui-icon-size: 1rem; display: inline-block; vertical-align: middle;"></tui-icon>
      </span>
      <h1 class="form-page-title" style="display: flex; align-items: center; gap: 0.75rem;">
        {{ languageService.labels().common.viewDetail }}
        <span *ngIf="category" class="status-pill" [ngClass]="statusMap[category.status]?.css">
          ● {{ category.status }} - {{ statusMap[category.status]?.label }}
        </span>
      </h1>
    </div>
    
    <div class="form-header-actions">
      <!-- Nút Đóng (X) -->
      <button class="action-btn-circle" (click)="goBack()" [title]="languageService.labels().common.close">
        <tui-icon icon="@tui.x" style="--tui-icon-size: 14px;"></tui-icon>
      </button>
    </div>
  </div>

  <!-- Spinner loading -->
  <div class="loading-container" *ngIf="isLoading()" style="display: flex; justify-content: center; align-items: center; height: 300px; width: 100%;">
    <tui-loader size="xl"></tui-loader>
  </div>

  <!-- Panel chứa nội dung đối chiếu song song -->
  <div class="comparison-container" *ngIf="!isLoading() && category">
    <app-comparison-view
      [oldData]="oldData"
      [newData]="newData"
      [fieldConfig]="fieldConfig"
    ></app-comparison-view>

    <!-- Nút hành động + 3 dialog xác nhận (dùng chung) -->
    <app-detail-footer-actions
      [permissionPrefix]="'CATEGORY'"
      [entityStatus]="category.status"
      [entityIsDisplay]="category.isDisplay"
      [hasNewData]="!!(category.newData && category.newData !== '')"
      (confirmDelete)="onConfirmDelete()"
      (confirmSendApproval)="onSendApprovalRecord()"
      (confirmApprove)="onConfirmApprove()"
      (confirmReject)="onConfirmReject($event)"
      (back)="goBack()"
    ></app-detail-footer-actions>
  </div>
</div>
