<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2 class="login-title">ĐĂNG NHẬP</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <tui-textfield>
          <label tuiLabel>Tên đăng nhập</label>
          <input tuiInput id="username" formControlName="username" placeholder="Nhập tên đăng nhập" />
        </tui-textfield>
        <div class="error-msg" *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
          {{ loginForm.get('username')?.errors?.['zodError'] || 'Tên đăng nhập không được để trống' }}
        </div>
      </div>

      <div class="input-group">
        <tui-textfield>
          <label tuiLabel>Mật khẩu</label>
          <input tuiInput id="password" type="password" formControlName="password" placeholder="Nhập mật khẩu" />
        </tui-textfield>
        <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          {{ loginForm.get('password')?.errors?.['zodError'] || 'Mật khẩu không được để trống' }}
        </div>
      </div>

      <button tuiButton type="submit" class="btn-login" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">ĐĂNG NHẬP</span>
        <span *ngIf="isLoading()">Đang đăng nhập...</span>
      </button>
    </form>
  </div>
</div>
